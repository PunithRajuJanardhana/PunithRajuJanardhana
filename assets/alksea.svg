<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="455" viewBox="0 0 1080 455" role="img" aria-labelledby="title desc"><title id="title">Alksea</title><desc id="desc">Original profile artwork for Punith Raju Janardhana.</desc><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#283148" stroke-width=".6"/></pattern><linearGradient id="ink"><stop stop-color="#baff39"/><stop offset="1" stop-color="#53e5ff"/></linearGradient><radialGradient id="light"><stop stop-color="#576bff" stop-opacity=".32"/><stop offset="1" stop-color="#090b13" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.orbit{transform-origin:835px 200px;animation:spin 32s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style><rect width="1080" height="455" rx="20" fill="#090b13"/><rect width="1080" height="455" rx="20" fill="url(#grid)"/><text x="38" y="44" font-size="13" fill="#baff39" class="mono">01 / CURRENT FOCUS</text><circle class="pulse" cx="1019" cy="39" r="7" fill="#baff39"/><text x="32" y="143" font-size="100" fill="#f4f6ff" font-weight="900" letter-spacing="-5">ALKSEA</text><text x="40" y="185" font-size="26" fill="#53e5ff" >Wallet compliance infrastructure.</text><text x="40" y="225" font-size="18" fill="#bdc7dc" >Security. Auditability. Operational reliability.</text><path d="M40 258H1040" stroke="#343c51"/><rect x="40" y="286" width="318" height="96" rx="10" fill="#141b2b" stroke="#39435b"/><text x="58" y="320" font-size="17" fill="#baff39" font-weight="800">PERMISSIONS</text><text x="58" y="352" font-size="16" fill="#c5cde0" >Who can do what?</text><rect x="381" y="286" width="318" height="96" rx="10" fill="#141b2b" stroke="#39435b"/><text x="399" y="320" font-size="17" fill="#baff39" font-weight="800">AUDIT TRAILS</text><text x="399" y="352" font-size="16" fill="#c5cde0" >How did we get here?</text><rect x="722" y="286" width="318" height="96" rx="10" fill="#141b2b" stroke="#39435b"/><text x="740" y="320" font-size="17" fill="#baff39" font-weight="800">RECOVERY</text><text x="740" y="352" font-size="16" fill="#c5cde0" >What happens next?</text><text x="40" y="425" font-size="14" fill="#c5cde0" class="mono">ENGINEERING FOR THE MOMENTS WHEN SYSTEMS FAIL.</text><text x="1040" y="425" font-size="16" fill="#53e5ff" text-anchor="end">alksea.com ↗</text><g transform="translate(862 102)" fill="none" stroke="#baff39" stroke-width="3"><path d="M0-37 49-19V13C49 43 0 65 0 65S-49 43-49 13V-19Z"/><path d="m-21 10 15 15 30-37"/></g><rect x=".5" y=".5" width="1079" height="454" rx="20" fill="none" stroke="#32394e"/></svg>