<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="652" viewBox="0 0 1080 652" role="img" aria-labelledby="title desc"><title id="title">Offline</title><desc id="desc">Original profile artwork for Punith Raju Janardhana.</desc><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#283148" stroke-width=".6"/></pattern><linearGradient id="ink"><stop stop-color="#baff39"/><stop offset="1" stop-color="#53e5ff"/></linearGradient><radialGradient id="light"><stop stop-color="#576bff" stop-opacity=".32"/><stop offset="1" stop-color="#090b13" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.orbit{transform-origin:835px 200px;animation:spin 32s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style><rect width="1080" height="652" rx="20" fill="#090b13"/><rect width="1080" height="652" rx="20" fill="url(#grid)"/><text x="40" y="44" font-size="13" fill="#53e5ff" class="mono">05 / AWAY FROM THE KEYBOARD</text><text x="34" y="117" font-size="59" fill="#f4f6ff" font-weight="900" letter-spacing="-2">OFFLINE. STILL ALL IN.</text><text x="40" y="156" font-size="21" fill="#bdc7dc" >A match. A race. An idea for the next trip.</text><rect x="40" y="188" width="1000" height="57" rx="7" fill="#121827"/><rect x="40" y="198" width="3" height="37" fill="#baff39"/><text x="61" y="224" font-size="16" fill="#baff39" class="mono">01</text><text x="115" y="224" font-size="15" fill="#c5cde0" class="mono">FOOTBALL</text><text x="365" y="227" font-size="31" fill="#baff39" font-weight="800">Messi</text><path d="m961 205-12 23m30-23-12 23m30-23-12 23" stroke="#baff39" stroke-width="3" opacity=".5"/><rect x="40" y="253" width="1000" height="57" rx="7" fill="#121827"/><rect x="40" y="263" width="3" height="37" fill="#53e5ff"/><text x="61" y="289" font-size="16" fill="#53e5ff" class="mono">02</text><text x="115" y="289" font-size="15" fill="#c5cde0" class="mono">CRICKET</text><text x="365" y="292" font-size="31" fill="#53e5ff" font-weight="800">Rohit Sharma</text><path d="m961 270-12 23m30-23-12 23m30-23-12 23" stroke="#53e5ff" stroke-width="3" opacity=".5"/><rect x="40" y="318" width="1000" height="57" rx="7" fill="#121827"/><rect x="40" y="328" width="3" height="37" fill="#c9a6ff"/><text x="61" y="354" font-size="16" fill="#c9a6ff" class="mono">03</text><text x="115" y="354" font-size="15" fill="#c5cde0" class="mono">FORMULA 1</text><text x="365" y="357" font-size="31" fill="#c9a6ff" font-weight="800">Lewis Hamilton</text><path d="m961 335-12 23m30-23-12 23m30-23-12 23" stroke="#c9a6ff" stroke-width="3" opacity=".5"/><rect x="40" y="383" width="1000" height="57" rx="7" fill="#121827"/><rect x="40" y="393" width="3" height="37" fill="#ffab79"/><text x="61" y="419" font-size="16" fill="#ffab79" class="mono">04</text><text x="115" y="419" font-size="15" fill="#c5cde0" class="mono">MOTOGP</text><text x="365" y="422" font-size="31" fill="#ffab79" font-weight="800">Valentino Rossi</text><path d="m961 400-12 23m30-23-12 23m30-23-12 23" stroke="#ffab79" stroke-width="3" opacity=".5"/><rect x="40" y="448" width="1000" height="57" rx="7" fill="#121827"/><rect x="40" y="458" width="3" height="37" fill="#ff96b7"/><text x="61" y="484" font-size="16" fill="#ff96b7" class="mono">05</text><text x="115" y="484" font-size="15" fill="#c5cde0" class="mono">BASKETBALL</text><text x="365" y="487" font-size="31" fill="#ff96b7" font-weight="800">Devin Booker</text><path d="m961 465-12 23m30-23-12 23m30-23-12 23" stroke="#ff96b7" stroke-width="3" opacity=".5"/><path d="M40 544H1040" stroke="#343c51"/><text x="40" y="583" font-size="21" fill="#baff39" font-weight="800">BENGALURU</text><circle cx="230" cy="575" r="4" fill="#baff39"/><path d="M242 575H580" stroke="#667591" stroke-dasharray="5 7"/><path d="m568 569 12 6-12 6" fill="none" stroke="#53e5ff" stroke-width="2"/><text x="607" y="583" font-size="20" fill="#53e5ff" font-weight="800">WHEREVER CURIOSITY LEADS</text><text x="40" y="621" font-size="19" fill="#bdc7dc" >Bengaluru will always be home. There’s plenty of the world left to see.</text><rect x=".5" y=".5" width="1079" height="651" rx="20" fill="none" stroke="#32394e"/></svg>