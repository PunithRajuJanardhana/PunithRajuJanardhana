<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="245" viewBox="0 0 1080 245" role="img" aria-labelledby="title desc"><title id="title">Keep Building</title><desc id="desc">Original profile artwork for Punith Raju Janardhana.</desc><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#283148" stroke-width=".6"/></pattern><linearGradient id="ink"><stop stop-color="#baff39"/><stop offset="1" stop-color="#53e5ff"/></linearGradient><radialGradient id="light"><stop stop-color="#576bff" stop-opacity=".32"/><stop offset="1" stop-color="#090b13" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.orbit{transform-origin:835px 200px;animation:spin 32s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style><rect width="1080" height="245" rx="20" fill="#090b13"/><rect width="1080" height="245" rx="20" fill="url(#grid)"/><text x="40" y="43" font-size="13" fill="#53e5ff" class="mono">04 / LEARNING BY BUILDING</text><rect x="40" y="77" width="134" height="87" rx="9" fill="#221c2d" stroke="#655174"/><text x="107" y="111" font-size="13" fill="#c6afd6" text-anchor="middle" class="mono">YC / 01</text><text x="107" y="145" font-size="16" fill="#ffb0b8" text-anchor="middle" font-weight="800">REJECTED</text><rect x="195" y="77" width="134" height="87" rx="9" fill="#221c2d" stroke="#655174"/><text x="262" y="111" font-size="13" fill="#c6afd6" text-anchor="middle" class="mono">YC / 02</text><text x="262" y="145" font-size="16" fill="#ffb0b8" text-anchor="middle" font-weight="800">REJECTED</text><rect x="350" y="77" width="134" height="87" rx="9" fill="#221c2d" stroke="#655174"/><text x="417" y="111" font-size="13" fill="#c6afd6" text-anchor="middle" class="mono">YC / 03</text><text x="417" y="145" font-size="16" fill="#ffb0b8" text-anchor="middle" font-weight="800">REJECTED</text><text x="549" y="112" font-size="33" fill="#f4f6ff" font-weight="900">STILL CURIOUS.</text><text x="549" y="154" font-size="33" fill="#baff39" font-weight="900">STILL BUILDING.</text><text x="40" y="210" font-size="20" fill="#c5cde0" >Three Y Combinator rejections. More reasons to keep going.</text><rect x=".5" y=".5" width="1079" height="244" rx="20" fill="none" stroke="#32394e"/></svg>