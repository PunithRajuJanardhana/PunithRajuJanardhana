<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="483" viewBox="0 0 1080 483" role="img" aria-labelledby="title desc"><title id="title">Mission Control</title><desc id="desc">Original profile artwork for Punith Raju Janardhana.</desc><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#283148" stroke-width=".6"/></pattern><linearGradient id="ink"><stop stop-color="#baff39"/><stop offset="1" stop-color="#53e5ff"/></linearGradient><radialGradient id="light"><stop stop-color="#576bff" stop-opacity=".32"/><stop offset="1" stop-color="#090b13" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.orbit{transform-origin:835px 200px;animation:spin 32s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style><rect width="1080" height="483" rx="20" fill="#090b13"/><rect width="1080" height="483" rx="20" fill="url(#grid)"/><circle cx="810" cy="180" r="350" fill="url(#light)"/><path d="M690 0H1080V414H980Z" fill="#151834"/><text x="40" y="44" font-size="13" fill="#baff39" class="mono">PRJ® / PERSONAL FIELD NOTES</text><text x="1040" y="44" font-size="12" fill="#b7bfd4" text-anchor="end" class="mono">VOL. 01 — ALWAYS IN PROGRESS</text><g class="orbit" fill="none" stroke="#7d8aff"><ellipse cx="835" cy="200" rx="179" ry="58" transform="rotate(-45 835 200)"/><ellipse cx="835" cy="200" rx="179" ry="58" transform="rotate(45 835 200)"/><circle cx="835" cy="200" r="134" stroke-dasharray="3 12"/><circle cx="961" cy="155" r="9" fill="#baff39" stroke="none"/></g><text x="33" y="161" font-size="89" fill="#f4f6ff" font-weight="900" letter-spacing="-5">HEY, I’M</text><text x="30" y="278" font-size="134" fill="#baff39" font-weight="900" letter-spacing="-8">PUNITH</text><text x="43" y="320" font-size="15" fill="#bfc8df" class="mono">RAJU JANARDHANA / SOFTWARE ENGINEER + PRODUCT BUILDER</text><path d="M40 351H1040" stroke="#3b4358"/><text x="42" y="389" font-size="20" fill="#f4f6ff" font-weight="800">BENGALURU ROOTS.</text><text x="384" y="389" font-size="20" fill="#53e5ff" font-weight="800">SEATTLE CHAPTERS.</text><text x="730" y="389" font-size="20" fill="#baff39" font-weight="800">BUILDING WHAT’S NEXT.</text><rect x="0" y="426" width="1080" height="57" fill="#baff39"/><text x="540" y="461" font-size="17" fill="#090b13" text-anchor="middle" font-weight="800" letter-spacing="2">RELIABLE BACKENDS  /  USEFUL AI  /  PRODUCTS WITH A PURPOSE</text><rect x=".5" y=".5" width="1079" height="482" rx="20" fill="none" stroke="#32394e"/></svg>