<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="246" viewBox="0 0 1080 246" role="img" aria-labelledby="title desc"><title id="title">End Transmission</title><desc id="desc">Original profile artwork for Punith Raju Janardhana.</desc><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#283148" stroke-width=".6"/></pattern><linearGradient id="ink"><stop stop-color="#baff39"/><stop offset="1" stop-color="#53e5ff"/></linearGradient><radialGradient id="light"><stop stop-color="#576bff" stop-opacity=".32"/><stop offset="1" stop-color="#090b13" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.orbit{transform-origin:835px 200px;animation:spin 32s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style><rect width="1080" height="246" rx="20" fill="#090b13"/><rect width="1080" height="246" rx="20" fill="url(#grid)"/><text x="40" y="45" font-size="13" fill="#53e5ff" class="mono">THE LOOP</text><text x="40" y="116" font-size="65" fill="#38435b" font-weight="900">01</text><text x="132" y="109" font-size="25" fill="#baff39" font-weight="900">UNDERSTAND</text><text x="389" y="116" font-size="65" fill="#38435b" font-weight="900">02</text><text x="481" y="109" font-size="25" fill="#baff39" font-weight="900">SHIP</text><text x="738" y="116" font-size="65" fill="#38435b" font-weight="900">03</text><text x="830" y="109" font-size="25" fill="#baff39" font-weight="900">LEARN</text><text x="40" y="173" font-size="27" fill="#f4f6ff" font-weight="700">Seek discomfort. Stay curious. Keep building.</text><text x="40" y="213" font-size="14" fill="#53e5ff" class="mono">HAVE SOMETHING WORTH BUILDING? LET’S TALK. ↗</text><rect x=".5" y=".5" width="1079" height="245" rx="20" fill="none" stroke="#32394e"/></svg>