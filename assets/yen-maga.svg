<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="355" viewBox="0 0 1050 355" role="img" aria-labelledby="title desc"><title id="title">Yen Maga</title><desc id="desc">Custom mission control artwork for Punith Raju Janardhana's GitHub profile.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#202838" stroke-width="0.6"/></pattern><linearGradient id="accent"><stop stop-color="#b6ff59"/><stop offset="1" stop-color="#51e5ff"/></linearGradient><radialGradient id="halo"><stop stop-color="#277d75" stop-opacity=".45"/><stop offset="1" stop-color="#080c14" stop-opacity="0"/></radialGradient></defs><rect width="1050" height="355" rx="20" fill="#080c14"/><rect width="1050" height="355" rx="20" fill="url(#grid)"/><path d="M680 0H1050V355H820L680 215Z" fill="#b6ff59"/><text x="38" y="43" fill="#b6ff59" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2">01 / THE MAIN QUEST</text><text x="36" y="112" fill="#eef5ff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">YEN MAGA</text><text x="40" y="157" fill="#eef5ff" font-family="Arial, Helvetica, sans-serif" font-size="21" >Good people. Great events. One platform.</text><text x="40" y="205" fill="#b4bfd0" font-family="Arial, Helvetica, sans-serif" font-size="17" >Co-founding a social events &amp; ticketing platform</text><text x="40" y="232" fill="#b4bfd0" font-family="Arial, Helvetica, sans-serif" font-size="17" >with my sister, Vatsala. Building it end to end.</text><text x="40" y="305" fill="#51e5ff" font-family="Arial, Helvetica, sans-serif" font-size="14" >FROM FIRST IDEA TO FIRST TICKET  ↗  yenmaga.com</text><g transform="translate(748 93) rotate(-12 110 65)"><path d="M0 0H225V41a22 22 0 0 0 0 44V130H0V85a22 22 0 0 0 0-44Z" fill="#080c14"/><path d="M165 12V118" stroke="#b6ff59" stroke-dasharray="5 6"/><text x="22" y="49" fill="#b6ff59" font-family="Arial, Helvetica, san