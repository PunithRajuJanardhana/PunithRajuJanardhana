<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="305" viewBox="0 0 1080 305" role="img" aria-labelledby="title desc"><title id="title">Yen Maga</title><desc id="desc">Original profile artwork for Punith Raju Janardhana.</desc><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#283148" stroke-width=".6"/></pattern><linearGradient id="ink"><stop stop-color="#baff39"/><stop offset="1" stop-color="#53e5ff"/></linearGradient><radialGradient id="light"><stop stop-color="#576bff" stop-opacity=".32"/><stop offset="1" stop-color="#090b13" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.orbit{transform-origin:835px 200px;animation:spin 32s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style><rect width="1080" height="305" rx="20" fill="#090b13"/><rect width="1080" height="305" rx="20" fill="url(#grid)"/><text x="38" y="44" font-size="13" fill="#ffab79" class="mono">03 / OTHER VENTURES</text><rect x="861" y="21" width="178" height="32" rx="16" fill="#222534"/><text x="950" y="42" font-size="12" fill="#d4d8e5" text-anchor="middle">CURRENTLY PAUSED</text><text x="32" y="138" font-size="84" fill="#ffab79" font-weight="900" letter-spacing="-4">YEN MAGA</text><text x="40" y="182" font-size="14" fill="#d4d8e5" class="mono">EVENTS / COMMUNITY</text><text x="40" y="235" font-size="22" fill="#f4f6ff" >Discover events worth showing up for.</text><text x="40" y="269" font-size="20" fill="#bfc8db" >Co-founding with my sister, Vatsala.</text><path d="M765 86 1015 278M807 86 1057 278M723 86 973 278" stroke="#ffab79" stroke-width="12" opacity=".17"/><rect x=".5" y=".5" width="1079" height="304" rx="20" fill="none" stroke="#32394e"/></svg>